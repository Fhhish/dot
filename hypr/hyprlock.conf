general{
	hide_cursor= false
	ignore_empty_input= true
}
auth{
	pam:enabled= true
	pam:module: hyprlock
}
animations{
	enabled= true
}
background{
	monitor= 
	path= ~/Pictures/not_ai_wallpaper.png
	blur_passes= 2 
}
label{
	monitor=
	text=$TIME 
	position= 0, -150
	valign= top
	font_size= 50
	font_family= Roboto mono
}
image{
	monitor=
	path= ~/Pictures/yui.png
	border_size=0
	size= 300
	rounding= 10
	position= 0,50
	halign=center
	valign=center
}
input-field{
	monitor=
	size= 200, 50
	outline_thickness= 0
	font_family= Roboto
	rounding= -0.5	

	position= 0, -250
	halign=center
	valign=center

	inner_color= rgba(0,0,0,0.1)
	font_color= rgba(255,255,255,1)

	fade_on_empty= false
	fade_timeout= 500

	placeholder_text= <i></i>

	fail_color= rgba(0, 0, 0, 0.8)
	fail_text= <b>Attempts $ATTEMPTS</b>
	
	dots_spacing= 0.4

}
